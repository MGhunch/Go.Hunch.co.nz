<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO — Hunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/go.css">
</head>
<body>

  <!-- three round buttons on the red ground: driving / showing / set up -->
  <div class="dock">
    <a class="rnd" href="/drive" aria-label="Driving">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="4.2"/>
        <path d="M24 19.8V11M20.6 26.6l-7.2 5M27.4 26.6l7.2 5"/>
      </svg>
    </a>
    <a class="rnd" href="/play" aria-label="Showing">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="12" width="30" height="20" rx="2.5"/>
        <path d="M19 37h10M24 32v5"/>
      </svg>
    </a>
    <button class="rnd" id="setup-btn" aria-label="Set up">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="4.6"/>
        <path d="M24 8.5v4.4M24 35.1v4.4M39.5 24h-4.4M12.9 24H8.5M35 13l-3.1 3.1M16.1 31.9 13 35M35 35l-3.1-3.1M16.1 16.1 13 13"/>
      </svg>
    </button>
  </div>

  <!-- SET UP: a drawer, not a mode. Opens over the dock, closes back to it. -->
  <div class="modal" id="setup" hidden>
    <div class="sheet">
      <div class="sheet-head">SET UP<button class="x" id="setup-close" aria-label="Close">&times;</button></div>

      <div class="block">
        <div class="block-h">CHOOSE A PRESENTATION</div>
        <div class="shelf" id="shelf"></div>
      </div>

      <div class="block">
        <div class="block-h">UPLOAD A NEW ONE</div>
        <div class="up">
          <label class="file" id="filelabel"><input type="file" id="pdf" accept="application/pdf">CHOOSE PDF</label>
          <input class="fld" id="up-client" placeholder="Client (e.g. One NZ)">
          <input class="fld" id="up-job" placeholder="Job (e.g. ONE 096)">
          <input class="fld" id="up-title" placeholder="Title">
          <button class="up-go" id="up-go">UPLOAD</button>
          <div class="up-msg" id="up-msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/setup.js"></script>
</body>
</html>
