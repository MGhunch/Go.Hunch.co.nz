<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GO — Hunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/go.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#ED1C24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GO">
</head>
<body data-mode="door">

  <!-- Dots, alive behind the door -->
  <div id="hunch-splash">
    <h1 class="hs-sr-only">Hunch.</h1>
    <canvas id="hs-field"></canvas>
    <canvas id="hs-picture"></canvas>
    <div class="hs-insight" id="hs-insight"></div>
  </div>

  <!-- three buttons at the bottom: driving / showing / set up -->
  <div class="dock">
    <a class="rnd" href="/drive" aria-label="Driving — present from here">
      <svg viewBox="0 0 48 48" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 22V12.5a2.2 2.2 0 0 1 4.4 0V21m0-1.5a2.2 2.2 0 0 1 4.4 0V22m0-1a2.2 2.2 0 0 1 4.4 0v6.5c0 4.2-2.8 7-7 7h-1.2c-2 0-3.3-.7-4.7-2.4l-4-5.2c-.9-1.2-.5-2.6.8-3.1 1-.4 2 0 2.7 1l1 1.4"/>
      </svg>
    </a>
    <a class="rnd" href="/play" aria-label="Showing — a screen driven from your phone">
      <svg viewBox="0 0 48 48" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="12" width="32" height="20" rx="2.5"/><path d="M20 37h8M24 32v5"/>
      </svg>
    </a>
    <button class="rnd" id="setup-btn" aria-label="Set up — choose or upload a deck">
      <svg viewBox="0 0 48 48" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 19.5h26M11 28.5h26"/>
        <circle cx="18" cy="19.5" r="3.6" fill="#fff"/><circle cx="31" cy="28.5" r="3.6" fill="#fff"/>
      </svg>
    </button>
  </div>

  <!-- SET UP: a drawer, not a mode. Opens over the Dots, closes back to it. -->
  <div class="modal" id="setup" hidden>
    <div class="sheet">
      <div class="sheet-head">SET UP<button class="x" id="setup-close" aria-label="Close">&times;</button></div>

      <div class="block">
        <div class="block-h">CHOOSE A PRESENTATION</div>
        <div class="shelf" id="shelf"></div>
      </div>

      <div class="block">
        <div class="block-h">UPLOAD A NEW ONE</div>
        <div class="up">
          <label class="file" id="filelabel"><input type="file" id="pdf" accept="application/pdf">CHOOSE PDF</label>
          <input class="fld" id="up-client" placeholder="Client (e.g. One NZ)">
          <input class="fld" id="up-job" placeholder="Job (e.g. ONE 096)">
          <input class="fld" id="up-title" placeholder="Title">
          <button class="up-go" id="up-go">UPLOAD</button>
          <div class="up-msg" id="up-msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/dots.js"></script>
  <script src="/static/setup.js"></script>
</body>
</html>
