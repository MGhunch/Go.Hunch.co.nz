<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO — Hunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/go.css">
</head>
<body data-mode="play">

  <!-- Dots holding page (shown at rest) -->
  <div id="hunch-splash">
    <h1 class="hs-sr-only">Hunch.</h1>
    <canvas id="hs-field"></canvas>
    <canvas id="hs-picture"></canvas>
    <div class="hs-insight" id="hs-insight"></div>
  </div>

  <!-- the work (shown when a job is live) -->
  <div id="deck"><canvas id="deck-canvas"></canvas></div>
  <div id="tapnav"></div>

  <!-- the one tap the screen's browser is ever asked for -->
  <button id="go-btn" class="go-btn">GO FULL SCREEN</button>

  <script src="/static/dots.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>
  <script src="/static/play.js"></script>
</body>
</html>
