<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO — driving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/go.css">
</head>
<body data-mode="drive">

  <!-- the shelf: pick a pack to run (shown until one's presenting) -->
  <div class="drive-pick" id="pick">
    <div class="drive-head"><span class="dot" id="dot"></span>DRIVING</div>
    <div class="shelf" id="shelf"></div>
  </div>

  <!-- present here: this machine shows the deck it's driving -->
  <div id="deck"><canvas id="deck-canvas"></canvas></div>
  <div id="tapnav"></div>

  <!-- auto-hiding control strip (Michael's, gets out of the way for the room) -->
  <div class="strip" id="strip">
    <span class="dot" id="dot2"></span>
    <span class="page-read" id="pageread">—</span>
    <a class="s-btn" id="save" download>SAVE</a>
    <button class="s-btn" id="switch">SWITCH</button>
    <button class="s-btn" id="end">END</button>
    <button class="s-btn" id="full">FULL SCREEN</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>
  <script src="/static/drive.js"></script>
</body>
</html>
